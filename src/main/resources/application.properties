# DB locale
spring.datasource.url=jdbc:postgresql://localhost:5432/school_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# HikariCP — adapté à Neon Free (ferme les connexions idle après ~5 min)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
server.port=${PORT:8080}
spring.application.name=eduschedule-backend
# Flyway - NE JAMAIS changer validate-on-migrate en production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
# n8n — toujours surcharger via N8N_WEBHOOK_URL et N8N_EMAIL_TRIGGER_URL en production
n8n.webhook.url=${N8N_WEBHOOK_URL:https://danelle-princesslike-unhypothetically.ngrok-free.dev/webhook/emploi-du-temps}
n8n.email.trigger.url=${N8N_EMAIL_TRIGGER_URL:https://danelle-princesslike-unhypothetically.ngrok-free.dev/webhook/email-trigger}
# Frontend URL — surcharger via APP_FRONTEND_URL en production (Render)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
# Logs
logging.level.com.school=DEBUG
logging.level.org.hibernate.SQL=WARN
# Claude IA — Anthropic
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
