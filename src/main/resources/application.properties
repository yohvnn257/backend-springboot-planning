# DB locale
spring.datasource.url=jdbc:postgresql://localhost:5432/school_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
server.port=${PORT:8080}
spring.application.name=eduschedule-backend
# Flyway - NE JAMAIS changer validate-on-migrate en production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
# n8n
n8n.webhook.url=https://danelle-princesslike-unhypothetically.ngrok-free.dev/webhook/emploi-du-temps
n8n.email.trigger.url=https://danelle-princesslike-unhypothetically.ngrok-free.dev/webhook/email-trigger
# Frontend URL - REMPLACER en production via variable Railway APP_FRONTEND_URL
app.frontend.url=http://localhost:4200
# Logs
logging.level.com.school=DEBUG
logging.level.org.hibernate.SQL=WARN
# Claude IA — Anthropic
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
